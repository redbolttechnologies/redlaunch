{{define "login.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Redlaunch">
  <title>Redlaunch · Sign in</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login-page" aria-labelledby="login-title">
    <section class="login-card">
      <div class="login-brand" aria-label="Redlaunch">
        <img class="brand-logo" src="/static/redlaunch-logo.svg" alt="Redlaunch" width="108" height="28">
      </div>
      <div class="login-heading">
        <h1 id="login-title">Sign in to Redlaunch</h1>
        <p>Use an authorized Google account to access this server.</p>
      </div>
      {{if .Error}}
      <div class="setup-alert login-alert" role="alert">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 8v4M12 16h.01"></path>
        </svg>
        <span>{{.Error}}</span>
      </div>
      {{end}}
      <a class="button button-secondary login-google-button" href="{{.GoogleLoginURL}}">
        <svg class="google-logo" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M21.35 12.27c0-.78-.07-1.53-.23-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.95 2.94v2.45h3.15c1.84-1.69 2.91-4.18 2.91-7.42z"></path>
          <path fill="#34A853" d="M12 21.7c2.63 0 4.84-.87 6.45-2.36l-3.15-2.45c-.87.58-1.98.93-3.3.93-2.54 0-4.7-1.72-5.47-4.03H3.28v2.53A9.74 9.74 0 0 0 12 21.7z"></path>
          <path fill="#FBBC05" d="M6.53 13.79a5.84 5.84 0 0 1 0-3.58V7.68H3.28a9.73 9.73 0 0 0 0 8.64l3.25-2.53z"></path>
          <path fill="#EA4335" d="M12 6.18c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.27 14.63 2.3 12 2.3a9.74 9.74 0 0 0-8.72 5.38l3.25 2.53C7.3 7.9 9.46 6.18 12 6.18z"></path>
        </svg>
        <span>Login with Google</span>
      </a>
      <p class="login-footnote">Access is limited to accounts explicitly added by an administrator.</p>
    </section>
  </main>
</body>
</html>
{{end}}
